<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Potager Urbain – Planifiez votre potager</title>
<style>
:root{--g:#2f6b3a;--g2:#7fb069;--bg:#f6f8f2;--card:#fff;--tx:#1f2a1f;--mu:#6b7a6b;--line:#dfe7d8;--warn:#c2410c}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
header{background:linear-gradient(120deg,var(--g),var(--g2));color:#fff;padding:16px 22px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:center}
header h1{margin:0;font-size:1.25rem}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:999px;padding:7px 12px;cursor:pointer;font:inherit;font-size:.9rem}
nav button.on{background:#fff;color:var(--g);font-weight:700}
main{max-width:980px;margin:0 auto;padding:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 4px 14px rgba(0,0,0,.04)}
h2{margin:0 0 10px;color:var(--g)}h3{margin:14px 0 6px}
.muted{color:var(--mu);font-size:.92rem}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.stat{font-size:1.8rem;font-weight:800;color:var(--g)}
button.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font:inherit;font-weight:600}
button.btn:hover{filter:brightness(1.08)}button.btn:disabled{opacity:.45;cursor:not-allowed}
button.sec{background:#e8f0e2;color:var(--g)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>input{flex:1;min-width:160px}
.tag{display:inline-block;background:#e8f0e2;color:var(--g);border-radius:999px;padding:3px 10px;font-size:.82rem;margin:2px}
.water{color:var(--warn);font-weight:600}
ul.log{list-style:none;padding:0;margin:0}ul.log li{padding:10px 0;border-bottom:1px solid var(--line)}
.price{font-size:2rem;font-weight:800;color:var(--g)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--g);color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--warn)}[hidden]{display:none!important}
</style></head>
<body>
<header><h1>🌱 Potager Urbain</h1>
<nav id="nav">
<button data-page="accueil">Accueil</button><button data-page="potagers">Mes potagers</button><button data-page="calendrier">Calendrier</button><button data-page="arrosage">Arrosage</button><button data-page="journal">Journal</button><button data-page="cultures">Cultures</button><button data-page="calculateur">Calculateur</button><button data-page="conseils">Conseils</button><button data-page="tarifs">Tarifs</button><button data-page="compte">Mon compte</button>
</nav></header>
<main id="main"></main>
<div id="toast" class="toast" hidden></div>
<script>
const PLANS = {
  gratuit: { id: 'gratuit', name: 'Gratuit', maxPlots: 2, price: 0 },
  pro: { id: 'pro', name: 'Pro', maxPlots: Infinity, price: 4 },
};
const CROPS = {
  tomate: { nom: 'Tomate', semis: [3, 4], recolte: [7, 9], m2: 0.5 },
  carotte: { nom: 'Carotte', semis: [3, 7], recolte: [6, 10], m2: 0.05 },
  laitue: { nom: 'Laitue', semis: [2, 9], recolte: [4, 11], m2: 0.25 },
  courgette: { nom: 'Courgette', semis: [4, 6], recolte: [6, 10], m2: 1 },
  radis: { nom: 'Radis', semis: [3, 9], recolte: [4, 10], m2: 0.05 },
};
const DAY = 86400000;

function canAddPlot(plan, count) {
  return count < PLANS[plan].maxPlots;
}
function createPlot(name, m2) {
  const n = String(name || '').trim();
  const area = Number(m2);
  if (!n) throw new Error('Nom obligatoire');
  if (!(area > 0 && area <= 500)) throw new Error('Surface entre 0 et 500 m²');
  return { id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: n, m2: area, lastWatered: null, entries: [] };
}
function addEntry(plot, text, now = Date.now()) {
  const t = String(text || '').trim();
  if (!t) throw new Error('Note vide');
  plot.entries.unshift({ text: t, at: now });
  return plot;
}
function waterPlot(plot, now = Date.now()) {
  plot.lastWatered = now;
  return plot;
}
function needsWater(plot, now = Date.now(), days = 2) {
  return plot.lastWatered === null || now - plot.lastWatered >= days * DAY;
}
function cropsForMonth(month, mode = 'semis') {
  return Object.entries(CROPS)
    .filter(([, c]) => month >= c[mode === 'semis' ? 'semis' : 'recolte'][0] && month <= c[mode === 'semis' ? 'semis' : 'recolte'][1])
    .map(([k, c]) => c.nom);
}
function plantsFit(area, crop) {
  const c = CROPS[crop];
  if (!c) throw new Error('Culture inconnue');
  return Math.floor(area / c.m2);
}

const $=(s)=>document.querySelector(s);
const MOIS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const PAGES=['accueil','potagers','calendrier','arrosage','journal','cultures','calculateur','conseils','tarifs','compte'];
const KEY='potager-v1';
let state;
function load(){try{state=JSON.parse(localStorage.getItem(KEY))}catch{}
 if(!state)state={plan:'gratuit',plots:[]};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function toast(m,err){const t=$('#toast');t.textContent=m;t.className='toast'+(err?' err':'');t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const now=()=>Date.now();
const page=()=>PAGES.includes(location.hash.slice(1))?location.hash.slice(1):'accueil';

const V={
accueil(){const n=state.plots.length,a=state.plots.reduce((s,p)=>s+p.m2,0),w=state.plots.filter(p=>needsWater(p)).length;
 return `<div class="grid">
 <div class="card"><div class="muted">Potagers</div><div class="stat">${n}</div></div>
 <div class="card"><div class="muted">Surface cultivée</div><div class="stat">${a.toFixed(1)} m²</div></div>
 <div class="card"><div class="muted">À arroser</div><div class="stat">${w}</div></div>
 <div class="card"><div class="muted">Plan</div><div class="stat">${PLANS[state.plan].name}</div></div></div>
 <div class="card"><h2>Ce mois-ci : ${MOIS[new Date().getMonth()]}</h2>
 <p><strong>À semer :</strong> ${cropsForMonth(new Date().getMonth()+1,'semis').join(', ')||'rien pour l’instant'}</p>
 <p><strong>Prêt à récolter :</strong> ${cropsForMonth(new Date().getMonth()+1,'recolte').join(', ')||'rien pour l’instant'}</p>
 <button class="btn" data-go="potagers">Gérer mes potagers</button></div>`},
potagers(){return `<div class="card"><h2>Ajouter un potager</h2>
 <div class="row"><input id="plot-name" placeholder="Nom (ex. Balcon sud)" maxlength="60"><input id="plot-m2" type="number" step="0.1" min="0.1" max="500" placeholder="Surface m²">
 <button class="btn" id="btn-add-plot">Ajouter</button></div>
 <p class="muted">Plan ${PLANS[state.plan].name} : ${PLANS[state.plan].maxPlots===Infinity?'potagers illimités':PLANS[state.plan].maxPlots+' potagers max'}.
 ${canAddPlot(state.plan,state.plots.length)?'':'<span class="water">Limite atteinte : passez au plan Pro.</span>'}</p></div>
 <div class="grid">${state.plots.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><div class="muted">${p.m2} m²</div>
 <p>${needsWater(p)?'<span class="water">💧 À arroser</span>':'✔ Arrosé récemment'}</p>
 <button class="btn sec" data-water="${p.id}">Arroser</button>
 <button class="btn sec" data-del="${p.id}">Supprimer</button></div>`).join('')||'<p class="muted">Aucun potager.</p>'}</div>`},
calendrier(){const m=new Date().getMonth()+1;return `<div class="card"><h2>Calendrier des semis et récoltes</h2>
 <div class="row"><select id="cal-month">${MOIS.map((x,i)=>`<option value="${i+1}" ${i+1===m?'selected':''}>${x}</option>`).join('')}</select></div>
 <h3>À semer</h3><div id="cal-semis">${tags(cropsForMonth(Number($('#cal-month')?.value||m),'semis'))}</div>
 <h3>À récolter</h3><div id="cal-rec">${tags(cropsForMonth(Number($('#cal-month')?.value||m),'recolte'))}</div></div>`},
arrosage(){return `<div class="card"><h2>Arrosage</h2><p class="muted">Règle : arroser tous les 2 jours, tôt le matin.</p>
 <ul class="log">${state.plots.map(p=>`<li class="row" style="justify-content:space-between"><span>${esc(p.name)} ${needsWater(p)?'<span class="water">💧 à arroser</span>':''}</span><button class="btn sec" data-water="${p.id}">Arroser maintenant</button></li>`).join('')||'<li class="muted">Ajoutez un potager d’abord.</li>'}</ul></div>`},
journal(){const all=state.plots.flatMap(p=>p.entries.map(e=>({...e,plot:p.name}))).sort((a,b)=>b.at-a.at);
 return `<div class="card"><h2>Journal de culture</h2><div class="row"><select id="entry-plot">${state.plots.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
 <input id="entry-text" placeholder="Ex. Premières fleurs sur les tomates" maxlength="200"><button class="btn" id="btn-add-entry">Ajouter la note</button></div></div>
 <div class="card"><ul class="log">${all.map(e=>`<li><strong>${esc(e.plot)}</strong> · <span class="muted">${new Date(e.at).toLocaleDateString('fr-FR')}</span><br>${esc(e.text)}</li>`).join('')||'<li class="muted">Aucune note.</li>'}</ul></div>`},
cultures(){return `<div class="grid">${Object.values(CROPS).map(c=>`<div class="card"><h3>${c.nom}</h3><div class="muted">Semis : mois ${c.semis[0]} à ${c.semis[1]}</div><div class="muted">Récolte : mois ${c.recolte[0]} à ${c.recolte[1]}</div><div class="muted">${c.m2} m² par plant</div></div>`).join('')}</div>`},
calculateur(){return `<div class="card"><h2>Calculateur d’espace</h2><div class="row"><input id="calc-m2" type="number" step="0.1" min="0" placeholder="Surface en m²"><select id="calc-crop">${Object.entries(CROPS).map(([k,c])=>`<option value="${k}">${c.nom}</option>`).join('')}</select><button class="btn" id="btn-calc">Calculer</button></div>
 <p id="calc-out" class="muted"></p></div>`},
conseils(){return `<div class="card"><h2>Conseils</h2><ul><li>Arrosez le matin, au pied des plants, jamais sur le feuillage.</li><li>Paillez le sol pour garder l’humidité.</li><li>Associez carottes et poireaux pour limiter les parasites.</li><li>Récoltez les radis dès qu’ils sont prêts, sinon ils deviennent piquants.</li></ul></div>`},
tarifs(){return `<div class="grid"><div class="card"><h3>Gratuit</h3><div class="price">0 €</div><p class="muted">2 potagers</p><button class="btn sec" disabled>Plan actuel</button></div>
 <div class="card"><h3>Pro</h3><div class="price">4 €<span class="muted" style="font-size:1rem">/mois</span></div><p class="muted">Potagers illimités, rappels, export</p>
 <button class="btn" id="btn-pro" ${state.plan==='pro'?'disabled':''}>${state.plan==='pro'?'Plan actuel':'Passer au Pro'}</button>
 ${state.plan==='pro'?'<br><br><button class="btn sec" id="btn-cancel">Résilier</button>':''}</div></div>`},
compte(){return `<div class="card"><h2>Mon compte</h2><p>Plan : <strong>${PLANS[state.plan].name}</strong> · Potagers : ${state.plots.length}</p>
 <p class="muted">Données stockées sur cet appareil.</p><button class="btn sec" id="btn-reset">Réinitialiser mes données</button></div>`}
};
function tags(a){return a.map(x=>`<span class="tag">${x}</span>`).join('')||'<span class="muted">Rien ce mois-ci.</span>'}

function render(){const p=page();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.page===p));
 $('#main').innerHTML=V[p]();document.title='Potager Urbain – '+p;}
function act(fn,ok){try{fn();save();render();if(ok)toast(ok)}catch(e){toast(e.message,true)}}

document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.page){location.hash=t.dataset.page;return}
 if(t.dataset.go){location.hash=t.dataset.go;return}
 if(t.id==='btn-add-plot')return act(()=>{const p=createPlot($('#plot-name').value,$('#plot-m2').value);if(!canAddPlot(state.plan,state.plots.length))throw new Error('Limite du plan Gratuit atteinte');state.plots.push(p)},'Potager ajouté 🌱');
 if(t.dataset.water)return act(()=>{waterPlot(state.plots.find(p=>p.id===t.dataset.water))},'Arrosé 💧');
 if(t.dataset.del)return act(()=>{state.plots=state.plots.filter(p=>p.id!==t.dataset.del)},'Potager supprimé');
 if(t.id==='btn-add-entry')return act(()=>{const pl=state.plots.find(p=>p.id===$('#entry-plot').value);if(!pl)throw new Error('Créez d’abord un potager');addEntry(pl,$('#entry-text').value)},'Note ajoutée');
 if(t.id==='btn-calc')return act(()=>{const c=$('#calc-crop').value;$('#calc-out').textContent=`${plantsFit(Number($('#calc-m2').value),c)} plant(s) de ${CROPS[c].nom} tiennent sur cette surface.`});
 if(t.id==='btn-pro')return act(()=>{state.plan='pro'},'Plan Pro activé (démo, aucun paiement)');
 if(t.id==='btn-cancel')return act(()=>{state.plan='gratuit'},'Abonnement résilié');
 if(t.id==='btn-reset')return act(()=>{state.plots=[];state.plan='gratuit'},'Données réinitialisées');
});
document.addEventListener('change',e=>{if(e.target.id==='cal-month')render()});
window.addEventListener('hashchange',render);
load();if(!location.hash)location.hash='accueil';render();
</script></body></html>
